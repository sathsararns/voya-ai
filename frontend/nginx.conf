resolver 127.0.0.11 valid=10s ipv6=off;

upstream voya_api {
    zone voya_api 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # FastAPI already owns /api/v1, so preserve the entire request path.
        proxy_pass http://voya_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;

        # Deliver SSE events immediately, including during long AI generations.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://voya_api;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router routes must still work after a browser refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
